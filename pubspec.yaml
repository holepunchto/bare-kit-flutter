name: bare_kit_flutter
description: Flutter support for Bare Kit, which runs Bare in a thread of its own within the application.
version: 0.0.0
homepage: https://github.com/holepunchto/bare-kit-flutter
repository: https://github.com/holepunchto/bare-kit-flutter
issue_tracker: https://github.com/holepunchto/bare-kit-flutter/issues

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  bare_kit: ^0.1.0
  flutter:
    sdk: flutter
  jni: ^1.1.1
  jni_flutter: ^1.0.4

dev_dependencies:
  lints: ^6.1.0

flutter:
  plugin:
    platforms:
      android:
        dartPluginClass: BareKitFlutter
      ios:
        dartPluginClass: BareKitFlutter
      linux:
        dartPluginClass: BareKitFlutter
      macos:
        dartPluginClass: BareKitFlutter
      windows:
        dartPluginClass: BareKitFlutter
